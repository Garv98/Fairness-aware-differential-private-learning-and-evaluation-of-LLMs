project:
  name: FairDP_Research
  random_seed: 42

dataset:
  name: Credit Risk Dataset
  target: loan_status
  test_size: 0.2

privacy:
  delta: 1e-5
  epsilon_values:
    - 1
    - 3
    - 8

fairness:
  group_features:
    - person_age
    - person_home_ownership
    - person_income

training:
  batch_size: 64
  epochs: 20
  learning_rate: 0.001